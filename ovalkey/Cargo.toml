[package]
name = "ovalkey"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Valkey-backed session and user stores for oath's server"

[dependencies]
async-trait.workspace = true
oath = { workspace = true, features = ["server"] }
redis.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
oath = { workspace = true, features = ["server", "tls-ring"] }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[features]
tls-ring = ["oath/tls-ring"]
tls-aws-lc = ["oath/tls-aws-lc"]

[lints]
workspace = true
