[package]
name = "ovalkey"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Valkey-backed session and user stores for oath's server"

[dependencies]
async-trait.workspace = true
oath = { path = "../oath", features = ["server"] }
redis.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
oath = { path = "../oath", features = ["server", "tls-ring"] }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[features]
tls-ring = ["oath/tls-ring"]
tls-aws-lc = ["oath/tls-aws-lc"]

[lints]
workspace = true
