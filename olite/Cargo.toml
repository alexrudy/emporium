[package]
name = "olite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SQLite-backed session and user stores for oath's server"

[dependencies]
async-trait.workspace = true
chrono.workspace = true
oath = { workspace = true, features = ["server"] }
parking_lot.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
oath = { workspace = true, features = ["server", "tls-ring"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[features]
default = ["bundled"]
# Compile SQLite from source rather than linking the system library.
bundled = ["rusqlite/bundled"]
tls-ring = ["oath/tls-ring"]
tls-aws-lc = ["oath/tls-aws-lc"]

[lints]
workspace = true
