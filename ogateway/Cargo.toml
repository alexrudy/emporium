[package]
name = "ogateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "An OAuth2 / OIDC authentication gateway for reverse proxies using auth sub-requests"

[dependencies]
axum.workspace = true
clap.workspace = true
config.workspace = true
eyre.workspace = true
http.workspace = true
hyperdriver.workspace = true
oath = { workspace = true, features = ["server"] }
otool.workspace = true
serde.workspace = true
systemd-connector.workspace = true
tokio.workspace = true
tower-http = { workspace = true, features = ["catch-panic", "trace", "sensitive-headers", "propagate-header"] }
tower.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true

[features]
sqlite = ["otool/sqlite"]
valkey = ["otool/valkey"]
tls-ring = ["oath/tls-ring", "otool/tls-ring", "hyperdriver/tls-ring"]
tls-aws-lc = ["oath/tls-aws-lc", "otool/tls-aws-lc", "hyperdriver/tls-aws-lc"]

[lints]
workspace = true
