[package]
name = "ogateway"
version = "0.1.0"
edition = "2024"

[dependencies]
axum.workspace = true
clap.workspace = true
config.workspace = true
eyre.workspace = true
http.workspace = true
oath = { path = "../oath", features = ["server"] }
otool.path = "../otool"
serde.workspace = true
systemd-connector.workspace = true
tokio.workspace = true
tower-http = { workspace = true, features = ["catch-panic", "trace", "sensitive-headers", "propagate-header"] }
tower.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true

[features]
tls-ring = ["oath/tls-ring", "otool/tls-ring"]
tls-aws-lc = ["oath/tls-aws-lc", "otool/tls-aws-lc"]

[lints]
workspace = true
