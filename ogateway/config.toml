
[oath]
# OAuth2 scopes to request. `openid` is required for the id_token-based
# identity resolver; ott adds it defensively if you forget. Default:
# "openid email profile".
scopes = "openid email profile"

secure_cookies = false

[provider]
# Required: client credentials issued by the provider.
client_id = "ogateway"
client_secret = ""

# Display name shown on the "Sign in with X" button. Default: "OAuth".
provider_name = "Bastion"

# Public origin the redirect URI lives under. Combined with
# `/auth/callback` to form the URL you register with the provider.
# Default: "http://127.0.0.1:3000".
external_origin = "http://localhost:8080"

[provider.endpoints]
# Provider endpoints: set EITHER `issuer` (discovery — recommended for
# OIDC providers; ott fetches <issuer>/.well-known/openid-configuration
# at startup) OR both `auth_uri` and `token_uri` explicitly.
# issuer = "https://accounts.google.com"
auth_uri  = "http://localhost:3000/api/oauth/authorize"
token_uri = "http://localhost:3000/api/oauth/token"

# Additional providers. `[provider]` above is mounted at /auth/login and
# /auth/callback; each `[providers.<id>]` at /auth/<id>/login and
# /auth/<id>/callback (register that redirect URI with the provider).
# Fields are the same as `[provider]`, plus an optional `scopes` that
# overrides `[oath] scopes`.
#
# [providers.google]
# client_id = "..."
# client_secret = "..."
# provider_name = "Google"
# external_origin = "http://localhost:8080"
# scopes = "openid email"
# [providers.google.endpoints]
# issuer = "https://accounts.google.com"
#
# Which provider serves /auth/login. `[provider]`, if set, always does;
# otherwise defaults to the only provider. With several providers and no
# default, /auth/login shows a "Sign in with ..." page.
# default_provider = "google"

[server]
# Where to bind the HTTP listener. Default: "127.0.0.1:3000".
bind_addr = "127.0.0.1:3030"
verify_route = "/proxy/verify"

# Optional: derive redirect URIs from the origin each request arrived on,
# so one gateway can authenticate several hostnames. Each provider's
# redirect URI becomes `<origin><callback path>`, and must be registered
# with the provider for every host. Only trust these headers when the
# gateway is reachable exclusively through the proxy.
#
# [server.origin]
# kind = "x-forwarded"      # X-Forwarded-Proto/-Host/-Port (Caddy's default)
# kind = "forwarded"        # RFC 7239 Forwarded header
# default_scheme = "https"  # used when no proto is forwarded
#
# [server.origin]
# kind = "trusted-header"
# header = "X-Gateway-Callback"
#
# `trusted_header = "X-Gateway-Callback"` is shorthand for the latter.

