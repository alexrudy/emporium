[package]
name = "otunnel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A reverse proxy that requires an OAuth2 / OIDC sign-in before forwarding requests upstream"

[dependencies]
axum.workspace = true
# chateau = { workspace = true }
clap.workspace = true
config.workspace = true
cookie.workspace = true
eyre.workspace = true
http.workspace = true
hyper.workspace = true
hyproxy = { workspace = true, features = ["upgrade"] }
hyperdriver = { workspace = true}
oath = { workspace = true, features = ["server"] }
otool.workspace = true
serde.workspace = true
tokio.workspace = true
tower-http = { workspace = true, features = ["trace", "catch-panic", "sensitive-headers", "request-id", "propagate-header"] }
tower.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
uuid.workspace = true

[features]
sqlite = ["otool/sqlite"]
valkey = ["otool/valkey"]
tls-ring = ["hyperdriver/tls-ring"]
tls-aws-lc = ["hyperdriver/tls-aws-lc"]

[dev-dependencies]
hyperdriver = { workspace = true, features = ["tls-ring"] }
tokio = { workspace = true, features = ["macros", "rt", "net", "time", "io-util"] }

[lints]
workspace = true
