[package]
name = "storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Unified storage backends (local, memory, B2, 1Password) built on storage-driver"

[dependencies]
async-trait.workspace = true
b2-client = { workspace = true, optional = true }
camino = { workspace = true, features = ["serde1"] }
chrono.workspace = true
http.workspace = true
onepassword = { workspace = true, optional = true }
serde.workspace = true
storage-driver.workspace = true
tokio = { workspace = true, features = ["sync", "io-util"] }
tracing.workspace = true
tempfile = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[features]
default = ["b2", "local"]
b2 = ["dep:b2-client"]
local = ["tokio/fs"]
tmp = ["local", "tokio/fs", "dep:tempfile"]
onepassword = ["dep:onepassword", "dep:url"]
tls-ring = ["b2-client/tls-ring"]
tls-aws-lc = ["b2-client/tls-aws-lc"]


[lints]
workspace = true
