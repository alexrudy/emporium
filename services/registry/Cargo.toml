[package]
name = "registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "An OCI Distribution Specification container registry with pluggable storage"
publish.workspace = true

[[bin]]
name = "registry-server"
path = "src/main.rs"
required-features = ["cli", "tls-aws-lc"]

[dependencies]
axum.workspace = true
bytes.workspace = true
camino.workspace = true
clap = { workspace = true, optional = true }
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
storage.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }
toml_edit = { workspace = true, optional = true }
tower.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4"] }

[features]
tls-ring = ["storage/tls-ring"]
tls-aws-lc = ["storage/tls-aws-lc"]
b2 = ["storage/b2"]
onepassword = ["storage/onepassword"]
cli = ["tokio/macros", "tokio/rt-multi-thread", "dep:clap", "dep:toml_edit", "dep:tracing-subscriber"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyperdriver.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
