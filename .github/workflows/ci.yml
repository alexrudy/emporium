on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

name: CI

env:
  RUSTDOCFLAGS: "-Dwarnings"
  CARGO_TERM_COLOR: always

jobs:

  versions:
    name: Determine toolchain versions
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.stable.outputs.version }}
      msrv: ${{ steps.msrv.outputs.version }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Read pinned stable version
        id: stable
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "Pinned stable: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Read MSRV
        id: msrv
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^rust-version/{print $2}' Cargo.toml)
          echo "MSRV: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"


  build:
    name: Build
    runs-on: ubuntu-latest
    needs: versions
    continue-on-error: ${{ contains(fromJSON('["stable", "nightly", "beta"]'), matrix.toolchain) }}
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
        toolchain:
          - "${{ needs.versions.outputs.msrv }}"
          - "${{ needs.versions.outputs.stable }}"
          - stable
          - beta
          - nightly
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "${{ matrix.toolchain }}"
      - name: Run cargo build
        run: cargo build --release --target ${{ matrix.target }}

  check:
    name: Check
    runs-on: ubuntu-latest
    needs: versions
    strategy:
      matrix:
        steps:
          - name: cargo check
            run: just check
          - name: cargo doc
            run: just doc
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "${{ needs.versions.outputs.stable }}"
      - uses: extractions/setup-just@v4
      - name: ${{ matrix.steps.name }}
        run: ${{ matrix.steps.run }}

  test:
    name: Tests
    needs: versions
    runs-on: ubuntu-latest
    continue-on-error: ${{ contains(fromJSON('["stable", "nightly", "beta"]'), matrix.toolchain) }}
    strategy:
      matrix:
        toolchain:
          - "${{ needs.versions.outputs.msrv }}"
          - "${{ needs.versions.outputs.stable }}"
          - stable
          - beta

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - uses: extractions/setup-just@v4

      - name: Build cargo tests
        run: just test-build

      - name: Run cargo test
        run: just test-run

  lints:
    name: Lints
    runs-on: ubuntu-latest
    needs: versions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "${{ needs.versions.outputs.stable }}"
          components: rustfmt, clippy

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy -- -D warnings
