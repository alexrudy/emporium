[package]
name = "otool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared configuration, state, and session plumbing for axum apps that sign users in with oath"

[dependencies]
async-trait.workspace = true
axum.workspace = true
chrono = { workspace = true, features = ["serde"] }
cookie.workspace = true
dashmap.workspace = true
data-encoding.workspace = true
futures.workspace = true
http.workspace = true
oath = { workspace = true, features = ["server"] }
olite = { workspace = true, optional = true }
ovalkey = { workspace = true, optional = true }
secret.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true

[dev-dependencies]
oath = { workspace = true, features = ["server", "tls-ring"] }
serde_json.workspace = true
serde_urlencoded.workspace = true

toml.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "net", "time"] }
tower = { workspace = true, features = ["util"] }

[features]
# Allow `[sessions.store] backend = "sqlite"`.
sqlite = ["dep:olite"]
# Allow `[sessions.store] backend = "valkey"`.
valkey = ["dep:ovalkey"]
tls-ring = ["oath/tls-ring"]
tls-aws-lc = ["oath/tls-aws-lc"]

[lints]
workspace = true
